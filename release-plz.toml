# Git-only releases: no crate is published to crates.io.
[workspace]
git_only = true
publish = false
release = false
release_always = false
git_release_enable = false
changelog_update = false

# Only the xila executable gets GitHub Releases and binary artifacts.
[[package]]
name = "xila-tools"
release = true
git_release_enable = true
git_tag_name = "xila-tools-v{{ version }}"
git_release_name = "xila-tools v{{ version }}"
