name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: "Quality / Rust"
    uses: xila-project/workspace/.github/workflows/quality.yml@b216689233e8eaac92653bedaff417d82797d15e

  cargo:
    name: "Build & Test / Cargo workspace"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@b216689233e8eaac92653bedaff417d82797d15e
        with:
          cache-mode: target
          cache-generation: v1-tools
      - name: "Setup | Native build dependencies"
        run: mise run ci:packages
      - name: "Validate | Cargo lockfile"
        run: mise run lockfile:check
      - name: "Validate | Cargo workspace"
        run: mise run check
      - name: "Lint | Cargo workspace"
        run: mise run clippy
      - name: "Test | Cargo workspace"
        run: mise run test
      - name: "Build | Rust documentation"
        run: mise run documentation:check

  # The release builds the xila executable on these runners too; build it on
  # every pull request so that LittleFS (cc and bindgen) keeps compiling there.
  hosts:
    name: "Build / xila on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # mise.ci.toml configures Linux runners (apt packages, Cargo wrapper).
      MISE_ENV: ""
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Rust toolchain"
        uses: jdx/mise-action@v5.2.2
      # bindgen loads libclang; the Windows runners ship LLVM in this directory.
      - name: "Setup | libclang for bindgen"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $directory 'libclang.dll'))) { throw "libclang.dll not found in $directory" }
          "LIBCLANG_PATH=$directory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "Build | xila executable"
        run: mise run build:executable

  required:
    if: always()
    needs: [quality, cargo, hosts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Gate | Verify mandatory checks"
        env:
          QUALITY: ${{ needs.quality.result }}
          CARGO: ${{ needs.cargo.result }}
          HOSTS: ${{ needs.hosts.result }}
        run: test "$QUALITY" = success && test "$CARGO" = success && test "$HOSTS" = success
