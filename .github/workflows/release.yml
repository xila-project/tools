name: Native binary release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_initial_release:
        description: "One-time: publish xila-tools v0.1.0 without a release pull request"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tools-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version bump pull request
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.bootstrap_initial_release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: "Setup | Rust toolchain"
        uses: jdx/mise-action@v5.2.2
      - name: "Publish | Prepare version pull request"
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub release without crates.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: "Setup | Rust toolchain"
        uses: jdx/mise-action@v5.2.2
      - name: "Setup | Release configuration"
        id: release-config
        shell: bash
        env:
          BOOTSTRAP_INITIAL_RELEASE: ${{ inputs.bootstrap_initial_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$BOOTSTRAP_INITIAL_RELEASE" == "true" ]]; then
            # A normal release requires merging a release-plz pull request. The
            # initial version is already 0.1.0, so release-plz has no bump
            # pull request to open.
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xila-tools") | .version')"
            if [[ "$version" != "0.1.0" ]]; then
              echo "::error::Bootstrap is only supported for xila-tools v0.1.0 (found $version)"
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/xila-tools-v0.1.0"; then
              echo "::error::The initial tag already exists; use the normal release workflow"
              exit 1
            fi
            if ! grep -qx 'release_always = false' release-plz.toml; then
              echo "::error::Expected release_always = false in the regular configuration"
              exit 1
            fi
            # Keep the checked-out repository and default policy unchanged.
            configuration="$RUNNER_TEMP/release-plz-bootstrap.toml"
            sed 's/^release_always = false$/release_always = true/' release-plz.toml > "$configuration"
            echo "path=$configuration" >> "$GITHUB_OUTPUT"
            echo "Bootstrapping the initial git-only release with a temporary configuration."
          else
            echo "path=release-plz.toml" >> "$GITHUB_OUTPUT"
          fi
      - name: "Publish | Git tag and GitHub release"
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: ${{ steps.release-config.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Validate | Native binary release"
        id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -r '[.[] | select(.package_name == "xila-tools") | .tag] | first // empty' <<< "$RELEASES")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build and upload ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: "Setup | Rust toolchain"
        uses: jdx/mise-action@v5.2.2
      - name: "Setup | Native build dependencies"
        if: runner.os == 'Linux'
        env:
          MISE_ENV: ci
        run: mise run ci:packages
      # Every runner builds for its own host, so the host toolchain suffices.
      - name: "Build | Native executable"
        run: mise run build:release
      - name: "Validate | Host triple"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$TARGET"
      - name: "Publish | Unix binary archive"
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="xila-${TARGET}.tar.gz"
          tar -czf "$archive" -C target/release xila
          shasum -a 256 "$archive" > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256"
      - name: "Publish | Windows binary archive"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "xila-$env:TARGET.zip"
          Compress-Archive -Path "target/release/xila.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
          gh release upload "$env:RELEASE_TAG" "$archive" "$archive.sha256"
